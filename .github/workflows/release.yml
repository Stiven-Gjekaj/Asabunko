name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # WasmKit needs the tools of Swift 6.3 or newer.
      - name: Choose the newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the core package
        run: swift test --package-path AsaCore
      - name: Test the core package in a release build
        run: swift test -c release --package-path AsaCore
      - name: Build the IPA
        run: ./scripts/build-ipa.sh
      - name: Attach the IPA to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Asabunko.ipa \
            --title "Asabunko $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. The IPA is not signed. Sign and install it with AltStore, SideStore, Sideloadly, or TrollStore. The newest IPA is always at https://github.com/${{ github.repository }}/releases/latest/download/Asabunko.ipa"
