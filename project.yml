name: Asabunko
options:
  bundleIdPrefix: io.github.stivengjekaj
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: 6
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "YES"
    CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
packages:
  AsaCore:
    path: AsaCore
targets:
  Asabunko:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AsaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.asabunko
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: App/Info.plist
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
          DEAD_CODE_STRIPPING: "YES"
  AsabunkoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Asabunko
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.stivengjekaj.asabunko.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Asabunko
schemes:
  Asabunko:
    build:
      targets:
        Asabunko: all
        AsabunkoUITests: [test]
    test:
      targets:
        - AsabunkoUITests
